rule_files:
- zfs-health.rules.yml
evaluation_interval: 15s
tests:
- name: online
  interval: 15s
  input_series:
  - series: up{job="truenas_snmp",instance="100.114.236.88"}
    values: 1+0x5
  - series: zpoolHealthStr{job="truenas_snmp",instance="100.114.236.88",zpoolName="mainpool",zpoolHealthStr="ONLINE"}
    values: 1+0x5
  promql_expr_test:
  - expr: test:pool_state
    eval_time: 1m
    exp_samples:
    - labels: test:pool_state{instance="100.114.236.88",job="truenas_snmp",zpoolName="mainpool"}
      value: 1
    - labels: test:pool_state{instance="100.113.107.95",job="truenas_snmp",zpoolName="backuppool"}
      value: 4
    - labels: test:pool_state{instance="100.114.236.88",job="truenas_snmp",zpoolName="boot-pool"}
      value: 4
    - labels: test:pool_state{instance="100.113.107.95",job="truenas_snmp",zpoolName="boot-pool"}
      value: 4
